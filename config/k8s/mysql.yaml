apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
    template:
      metadata:
        labels:
          app: mysql
      spec:
        containers:
          - name: mysql
            image: mysql:8.4
            ports:
              - containerPort: 3306
            env:
              - name: mysql-user
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: mysql-user
              - name: mysql-password
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: mysql-password
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
