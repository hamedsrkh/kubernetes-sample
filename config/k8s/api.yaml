apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
    template:
      metadata:
        labels:
          app: api
      spec:
        containers:
          - name: api
            image: k8s-sample-api:local
            ports:
              - containerPort: 3001
            env:
              - name: NODE_ENV
                value: production
              - name: PORT
                value: "3001"
              - name: DB_HOST
                value: mysql
              - name: DB_PORT
                value: "3306"
              - name: mysql-user
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: mysql-user
              - name: mysql-password
                valueFrom:
                  secretKeyRef:
                    name: mysql-secret
                    key: mysql-password
              - name: DB_DATABASE
                value: articles_db
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
